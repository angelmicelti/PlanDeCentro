        :root {
            --primary-color: #1a4b8c;
            --secondary-color: #2c6cb0;
            --accent-color: #e63946;
            --light-color: #f8f9fa;
            --dark-color: #343a40;
            --success-color: #28a745;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background-color: #f5f5f5;
            color: var(--dark-color);
            line-height: 1.6;
        }
        
        header {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            padding: 1.5rem;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        .header-content {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        header h1 {
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
        }
        
        header p {
            font-size: 1rem;
            opacity: 0.9;
        }
        
        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
        }
        
        .nav-tabs {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.5rem;
            margin-bottom: 2rem;
        }
        
        .tab-btn {
            padding: 0.8rem 1.5rem;
            background-color: white;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            color: var(--dark-color);
        }
        
        .tab-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.15);
        }
        
        .tab-btn.active {
            background-color: var(--primary-color);
            color: white;
        }
        
        .section {
            display: none;
            animation: fadeIn 0.5s ease;
        }
        
        .section.active {
            display: block;
        }
        
        .section-title {
            text-align: center;
            margin-bottom: 2rem;
            color: var(--primary-color);
            font-size: 1.8rem;
            border-bottom: 2px solid var(--secondary-color);
            padding-bottom: 0.5rem;
            display: inline-block;
            width: 100%;
        }
        
        .buttons-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 1.5rem;
            margin-top: 1.5rem;
        }
        
        .apartado-btn {
            position: relative;
            padding: 1.2rem 0.8rem;
            background-color: white;
            border: 2px solid var(--secondary-color);
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 3px 6px rgba(0, 0, 0, 0.1);
            color: var(--primary-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100px;
            width: 200px;
            text-decoration: none;
        }
        
        .apartado-btn:hover {
            background-color: var(--secondary-color);
            color: white;
            transform: translateY(-5px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
        }
        
        .apartado-btn .apartado-code {
            font-size: 1.2rem;
            margin-bottom: 0.5rem;
            text-align: center;
        }
        
        .apartado-btn .apartado-name {
            font-size: 0.9rem;
            text-align: center;
            opacity: 0;
            max-height: 0;
            transition: all 0.3s ease;
        }
        
        .apartado-btn:hover .apartado-name {
            opacity: 1;
            max-height: 100px;
        }
        
        .tooltip {
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            font-size: 0.8rem;
            white-space: nowrap;
            z-index: 10;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            max-width: 300px;
            text-align: center;
        }
        
        .apartado-btn:hover .tooltip {
            opacity: 1;
        }
        
        footer {
            background-color: var(--dark-color);
            color: white;
            text-align: center;
            padding: 1.5rem;
            margin-top: 3rem;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        @media (max-width: 768px) {
            .nav-tabs {
                flex-direction: column;
                align-items: center;
            }
            
            .tab-btn {
                width: 100%;
                max-width: 300px;
            }
        }
        
        @media (max-width: 480px) {
            .buttons-grid {
                grid-template-columns: 1fr;
            }
            
            header h1 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>

        // Función para generar los botones de apartados
        function generarBotonesApartados() {
            for (const seccion in apartados) {
                const contenedor = document.querySelector(`#${seccion} .buttons-grid`);
                contenedor.innerHTML = '';
                
                apartados[seccion].forEach(apartado => {
                    const boton = document.createElement('a');
                    boton.className = 'apartado-btn';
                    boton.href = apartado.enlace;
                    boton.target = '_blank';
                    boton.innerHTML = `
                        <span class="apartado-code">${apartado.codigo}</span>
                        <span class="apartado-name">${apartado.nombre}</span>
                        <div class="tooltip">${apartado.nombre}</div>
                    `;
                    contenedor.appendChild(boton);
                });
            }
        }

        // Función para cambiar entre secciones
        function cambiarSeccion(seccionId) {
            // Ocultar todas las secciones
            document.querySelectorAll('.section').forEach(seccion => {
                seccion.classList.remove('active');
            });
            
            // Mostrar la sección seleccionada
            document.getElementById(seccionId).classList.add('active');
            
            // Actualizar botones activos
            document.querySelectorAll('.tab-btn').forEach(boton => {
                boton.classList.remove('active');
            });
            
            document.querySelector(`[data-target="${seccionId}"]`).classList.add('active');
        }

        // Inicializar la aplicación
        document.addEventListener('DOMContentLoaded', function() {
            // Generar botones de apartados
            generarBotonesApartados();
            
            // Configurar eventos para los botones de navegación
            document.querySelectorAll('.tab-btn').forEach(boton => {
                boton.addEventListener('click', function() {
                    const seccionId = this.getAttribute('data-target');
                    cambiarSeccion(seccionId);
                });
            });
